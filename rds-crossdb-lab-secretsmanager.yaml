AWSTemplateFormatVersion: '2010-09-09'
Description: >
  RDS SQL Server cross-database module signing lab (Secrets Manager edition).
  All passwords are auto-generated and stored in AWS Secrets Manager — zero
  hardcoded credentials. Provisions a VPC, an RDS SQL Server Express instance,
  and a Windows Server 2022 EC2 workload driver with SQL Server Management
  Studio (SSMS) pre-installed and .sql scripts on the Desktop that demonstrate
  certificate-based module signing as an RDS-compatible replacement for
  TRUSTWORTHY. Connect to the workload driver with Systems Manager Fleet
  Manager Remote Desktop (RDP tunneled over SSM — no inbound ports).
  NOTE: Sample data (CustomerName, CreditScore) is synthetic and for lab/demo
  purposes only. If this pattern is adapted for real credit or financial data,
  PCI-DSS controls and AWS shared-responsibility obligations apply. See
  https://aws.amazon.com/compliance/ for guidance on regulated data workloads.

Parameters:
  MasterUsername:
    Type: String
    Default: admin
    Description: RDS master username
  InstanceType:
    Type: String
    Default: db.t3.xlarge
    AllowedValues:
      - db.t3.medium
      - db.t3.large
      - db.t3.xlarge
    Description: RDS instance class
  Ec2InstanceType:
    Type: String
    Default: t3.large
    Description: Windows EC2 workload driver instance type (t3.large recommended for SSMS)
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
    Description: Latest Windows Server 2022 Full Base AMI (SSM Agent + AWS CLI preinstalled)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Database }
        Parameters: [MasterUsername, InstanceType]
      - Label: { default: Workload Driver }
        Parameters: [Ec2InstanceType, LatestAmiId]

Resources:
  # ──────────────────────────────────────────────
  # KMS Customer Managed Key (CMK) for Secrets Manager + RDS encryption
  # ──────────────────────────────────────────────
  LabKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for encrypting Secrets Manager secrets and RDS storage in this stack
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            # kms:* here is the AWS-recommended KMS key policy safety pattern to
            # prevent key lockout by delegating access control to account IAM.
            # This is an intentional root-account safety grant. For production,
            # any workload (non-root) principals granted access to this key should
            # be restricted to only the specific KMS actions they require (e.g.
            # kms:Decrypt, kms:DescribeKey) rather than kms:*. See AWS KMS key
            # policy best practices documentation.
            Action: kms:*
            Resource: '*'
          - Sid: AllowRdsServiceAccess
            Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lab-cmk
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  LabKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-lab-cmk
      TargetKeyId: !Ref LabKmsKey

  # ──────────────────────────────────────────────
  # Secrets Manager — auto-generated passwords
  # ──────────────────────────────────────────────
  RdsMasterSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      guard:
        SuppressedRules:
          # Rotation intentionally not configured for this short-lived lab; enabling
          # it requires an in-VPC rotation Lambda outside this lab's scope.
          - SECRETSMANAGER_ROTATION_ENABLED_CHECK
    Properties:
      Name: !Sub ${AWS::StackName}/rds-master-password
      Description: RDS SQL Server master user password
      KmsKeyId: !Ref LabKmsKey
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${MasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 30
        ExcludeCharacters: "\"@/\\`'"
      Tags:
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  AppUserSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      guard:
        SuppressedRules:
          - SECRETSMANAGER_ROTATION_ENABLED_CHECK
    Properties:
      Name: !Sub ${AWS::StackName}/app-user-password
      Description: AppUser SQL login password
      KmsKeyId: !Ref LabKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username": "AppUser"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: "\"@/\\`'"
      Tags:
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  DbMasterKeyASecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      guard:
        SuppressedRules:
          - SECRETSMANAGER_ROTATION_ENABLED_CHECK
    Properties:
      Name: !Sub ${AWS::StackName}/db-master-key-a
      Description: DatabaseA master key encryption password
      KmsKeyId: !Ref LabKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"database": "DatabaseA"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: "\"@/\\`'"
      Tags:
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  DbMasterKeyBSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      guard:
        SuppressedRules:
          - SECRETSMANAGER_ROTATION_ENABLED_CHECK
    Properties:
      Name: !Sub ${AWS::StackName}/db-master-key-b
      Description: DatabaseB master key encryption password
      KmsKeyId: !Ref LabKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"database": "DatabaseB"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: "\"@/\\`'"
      Tags:
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  CertTransferSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      guard:
        SuppressedRules:
          - SECRETSMANAGER_ROTATION_ENABLED_CHECK
    Properties:
      Name: !Sub ${AWS::StackName}/cert-transfer-password
      Description: Password used to export/import the cross-DB certificate private key
      KmsKeyId: !Ref LabKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"purpose": "certificate-private-key-transfer"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: "\"@/\\`'"
      Tags:
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  # Local Windows admin credentials used to log in to the workload driver via
  # Fleet Manager Remote Desktop ("User credentials" auth). Auto-generated and
  # stored in Secrets Manager — no hardcoded password.
  WindowsAdminSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      guard:
        SuppressedRules:
          - SECRETSMANAGER_ROTATION_ENABLED_CHECK
    Properties:
      Name: !Sub ${AWS::StackName}/windows-admin-password
      Description: Local Windows admin password for Fleet Manager Remote Desktop login
      KmsKeyId: !Ref LabKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username": "labadmin"}'
        GenerateStringKey: password
        PasswordLength: 24
        # Exclude characters that are awkward to type in an RDP login prompt or
        # that carry shell meaning during the PowerShell bootstrap.
        ExcludeCharacters: "\"@/\\`'"
      Tags:
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  # Attach the master secret to the RDS instance for rotation support
  SecretRdsAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref RdsMasterSecret
      TargetId: !Ref SqlServerInstance
      TargetType: AWS::RDS::DBInstance

  # ──────────────────────────────────────────────
  # Networking
  # ──────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      # Subnet does not auto-assign public IPs; the EC2 instance requests one
      # explicitly on its network interface (see WorkloadDriver).
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-a
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-b
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-rt
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Metadata:
      guard:
        SuppressedRules:
          # Required pattern: the public subnet route to the IGW is what allows the
          # NAT gateway to provide outbound-only internet to the private subnets.
          - NO_UNRESTRICTED_ROUTE_TO_IGW
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private subnets for the EC2 workload driver and RDS (no public IPs)
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-a
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-b
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  # NAT gateway gives private subnets outbound internet (no inbound from internet)
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat-eip
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-rt
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ──────────────────────────────────────────────
  # Security Groups
  # ──────────────────────────────────────────────
  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SQL Server from workload driver
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          SourceSecurityGroupId: !Ref Ec2SecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-rds-sg
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Workload driver - SSM / Fleet Manager only (no inbound RDP)
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-ec2-sg
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  # ──────────────────────────────────────────────
  # RDS SQL Server
  # ──────────────────────────────────────────────
  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for SQL Server RDS
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-db-subnet-group
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  RdsOptionGroup:
    Type: AWS::RDS::OptionGroup
    Properties:
      EngineName: sqlserver-ex
      MajorEngineVersion: '16.00'
      OptionGroupDescription: SQL Server Express option group
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-og
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  RdsParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: sqlserver-ex-16.0
      Description: SQL Server Express parameter group
      Parameters:
        rds.force_ssl: '1'
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-param-group
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  SqlServerInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Metadata:
      guard:
        SuppressedRules:
          # Engine constraint: SQL Server Express (sqlserver-ex) does not support Multi-AZ.
          - RDS_MULTI_AZ_SUPPORT
          # False positives: MasterUserPassword uses the secure dynamic reference
          # {{resolve:secretsmanager:...}} via Fn::Sub, which cfn-guard cannot parse.
          - RDS_MASTER_USER_PASSWORD_NO_PLAINTEXT_PASSWORD
          - RDS_MASTER_USER_PASSWORD_USES_SECURE_PARAMETER
          - RDS_MASTER_USER_PASSWORD_USES_SECURE_SERVICE
    Properties:
      DBInstanceIdentifier: !Sub ${AWS::StackName}-sqlserver
      Engine: sqlserver-ex
      EngineVersion: '16.00'
      DBInstanceClass: !Ref InstanceType
      AllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref LabKmsKey
      MasterUsername: !Sub '{{resolve:secretsmanager:${RdsMasterSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${RdsMasterSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref RdsSubnetGroup
      VPCSecurityGroups:
        - !GetAtt RdsSecurityGroup.GroupId
      OptionGroupName: !Ref RdsOptionGroup
      DBParameterGroupName: !Ref RdsParameterGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      MultiAZ: false
      AutoMinorVersionUpgrade: true
      LicenseModel: license-included
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-sqlserver
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  # ──────────────────────────────────────────────
  # EC2 Workload Driver (SSM-managed, no SSH key)
  # ──────────────────────────────────────────────
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-ec2-role
        - Key: Project
          Value: rds-crossdb-module-signing-lab

  # Managed policy (not inline) granting least-privilege access to the lab secrets and CMK
  Ec2SecretsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${AWS::StackName}-secrets-read-access
      Roles:
        - !Ref Ec2Role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref RdsMasterSecret
              - !Ref AppUserSecret
              - !Ref DbMasterKeyASecret
              - !Ref DbMasterKeyBSecret
              - !Ref CertTransferSecret
              - !Ref WindowsAdminSecret
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !GetAtt LabKmsKey.Arn

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2Role

  WorkloadDriver:
    Type: AWS::EC2::Instance
    DependsOn: SqlServerInstance
    Properties:
      InstanceType: !Ref Ec2InstanceType
      ImageId: !Ref LatestAmiId
      # Instance runs in a private subnet with no public IP; outbound internet
      # (package install, SSM, Secrets Manager, KMS) is via the NAT gateway.
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds:
        - !GetAtt Ec2SecurityGroup.GroupId
      IamInstanceProfile: !Ref Ec2InstanceProfile
      EbsOptimized: true
      UserData:
        Fn::Base64: !Sub |
          <powershell>
          # NOTE: do NOT set $ErrorActionPreference='Stop' globally — a single
          # failure (e.g. the large SSMS download) must not abort the account and
          # RDP setup below. Errors are handled locally instead.
          # Windows Server 2022 ships with PowerShell 5.1; force TLS 1.2 for downloads.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # ──────────────────────────────────────────────
          # 1. Create a local admin account for Fleet Manager Remote Desktop
          #    login. The password is pulled from Secrets Manager at boot, so no
          #    credential is ever hardcoded in this template.
          #    IMPORTANT: the Windows AMI ships AWS Tools for PowerShell, NOT the
          #    `aws` CLI — so use Get-SECSecretValue, not `aws secretsmanager`.
          #    Retry to absorb first-boot IAM/credential propagation lag.
          # ──────────────────────────────────────────────
          Import-Module AWSPowerShell -ErrorAction SilentlyContinue
          Import-Module AWS.Tools.SecretsManager -ErrorAction SilentlyContinue

          $secret = $null
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $sv = Get-SECSecretValue -SecretId '${WindowsAdminSecret}' -Region '${AWS::Region}'
              $secret = $sv.SecretString | ConvertFrom-Json
              break
            } catch {
              Start-Sleep -Seconds 15
            }
          }

          if ($secret) {
            $securePass = ConvertTo-SecureString $secret.password -AsPlainText -Force
            if (Get-LocalUser -Name $secret.username -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $secret.username -Password $securePass
            } else {
              New-LocalUser -Name $secret.username -Password $securePass `
                -FullName 'Lab Admin' -Description 'Fleet Manager RDP lab user' `
                -PasswordNeverExpires -AccountNeverExpires
            }
            Add-LocalGroupMember -Group 'Administrators' -Member $secret.username -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $secret.username -ErrorAction SilentlyContinue
          }

          # ──────────────────────────────────────────────
          # 2. Enable Remote Desktop. Fleet Manager Remote Desktop tunnels RDP
          #    over the SSM channel, so no inbound security-group rule is needed;
          #    RDP just has to be enabled on the host itself.
          # ──────────────────────────────────────────────
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue

          # ──────────────────────────────────────────────
          # 3. Install SSMS via a background scheduled task — NOT inline.
          #    Pinned to the SSMS 20.2.1 self-contained full installer (~660 MB,
          #    no runtime download). Do NOT use aka.ms/ssmsfullsetup: that now
          #    redirects to the SSMS 22 Visual Studio bootstrapper, which is a tiny
          #    stub that downloads its payload at install time and hangs silently
          #    in /Quiet mode. The 20.2.1 installer supports /Install /Quiet and
          #    completes deterministically.
          #    The install must not block this UserData script: EC2Launch runs its
          #    "start SSM Agent" task only AFTER UserData finishes, so a long
          #    inline install (Start-Process -Wait) delays SSM registration and
          #    blocks Fleet Manager. The task runs as SYSTEM in the background,
          #    retries the download, re-runs on reboot if interrupted, logs to
          #    C:\Windows\Temp\ssms-install.log, and removes itself once installed.
          # ──────────────────────────────────────────────
          $installScript = 'C:\Windows\Temp\install-ssms.ps1'
          @'
          $ErrorActionPreference = 'Continue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $log = 'C:\Windows\Temp\ssms-install.log'
          function Log($m) { "[{0}] {1}" -f (Get-Date), $m | Out-File -Append $log }
          $found = Get-ChildItem 'C:\Program Files*\Microsoft SQL Server Management Studio*' -Recurse -Filter Ssms.exe -ErrorAction SilentlyContinue
          if ($found) { Log 'SSMS already installed; removing task.'; Unregister-ScheduledTask -TaskName InstallSSMS -Confirm:$false -ErrorAction SilentlyContinue; return }
          $setup = 'C:\Windows\Temp\SSMS-Setup-ENU.exe'
          for ($i = 1; $i -le 5; $i++) {
            try {
              Log "Download attempt $i"
              Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2313753&clcid=0x409' -OutFile $setup -UseBasicParsing
              if ((Get-Item $setup).Length -gt 100MB) { break }
            } catch { Log "Download failed: $_"; Start-Sleep -Seconds 30 }
          }
          Log 'Starting installer'
          $p = Start-Process -FilePath $setup -ArgumentList '/Install','/Quiet','/Norestart' -Wait -PassThru
          Log "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) { Unregister-ScheduledTask -TaskName InstallSSMS -Confirm:$false -ErrorAction SilentlyContinue; Log 'Install complete; task removed.' }
          '@ | Out-File -FilePath $installScript -Encoding ASCII -Force

          $action    = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoProfile -ExecutionPolicy Bypass -File $installScript"
          $trigger   = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings  = New-ScheduledTaskSettingsSet -StartWhenAvailable -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
          Register-ScheduledTask -TaskName 'InstallSSMS' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
          Start-ScheduledTask -TaskName 'InstallSSMS'
          </powershell>
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workload-driver
        - Key: Project
          Value: rds-crossdb-module-signing-lab

# ──────────────────────────────────────────────
# Outputs
# ──────────────────────────────────────────────
Outputs:
  RdsEndpoint:
    Description: SQL Server RDS endpoint
    Value: !GetAtt SqlServerInstance.Endpoint.Address

  RdsPort:
    Description: SQL Server port
    Value: !GetAtt SqlServerInstance.Endpoint.Port

  WorkloadDriverInstanceId:
    Description: Windows EC2 instance ID (connect via Fleet Manager Remote Desktop)
    Value: !Ref WorkloadDriver

  RdsMasterSecretArn:
    Description: Secrets Manager ARN for RDS master password (use to connect SSMS to RDS)
    Value: !Ref RdsMasterSecret

  AppUserSecretArn:
    Description: Secrets Manager ARN for AppUser password
    Value: !Ref AppUserSecret

  CertTransferSecretArn:
    Description: Secrets Manager ARN for certificate transfer password
    Value: !Ref CertTransferSecret

  WindowsAdminSecretArn:
    Description: Secrets Manager ARN for the local Windows admin (Fleet Manager RDP login)
    Value: !Ref WindowsAdminSecret

  FleetManagerConsoleUrl:
    Description: Open Fleet Manager, select the node, then Node actions > Connect with Remote Desktop
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/systems-manager/managed-instances/${WorkloadDriver}/general?region=${AWS::Region}

  GetWindowsAdminPasswordCommand:
    Description: Retrieve the Fleet Manager Remote Desktop login (username + password)
    Value: !Sub >-
      aws secretsmanager get-secret-value --secret-id ${WindowsAdminSecret}
      --region ${AWS::Region} --query SecretString --output text

  UsageInstructions:
    Description: How to reach the Windows box and run the SQL demo in SSMS
    Value: >-
      1) Wait ~10-15 min after launch for SSMS to finish installing |
      2) Systems Manager > Fleet Manager > select this node > Node actions >
      Connect with Remote Desktop > User credentials (labadmin + password from
      WindowsAdminSecret) |
      3) Open SSMS, connect to the RdsEndpoint using SQL auth (admin + password
      from RdsMasterSecret) |
      4) Run the module-signing T-SQL from the blog step by step
